[tool.ruff]
target-version = "py312"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "PL"]

[tool.ruff.lint.per-file-ignores]
# Literal comparisons are normal and readable in test assertions.
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.cambridge_azur851 --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/"]

# serialx ships no type stubs; it is provided by Home Assistant at runtime.
[[tool.mypy.overrides]]
module = ["serialx", "serialx.*"]
ignore_missing_imports = true
